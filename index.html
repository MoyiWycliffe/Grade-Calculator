<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Calculator</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #eef6ff;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .calculator {
    background: #fff;
    padding: 30px 25px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  h2 {
    color: #0077cc;
    margin-bottom: 25px;
  }

  label {
    display: block;
    margin: 12px 0 5px;
    text-align: left;
    font-weight: bold;
  }

  input[type="number"] {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    box-sizing: border-box;
    transition: border 0.3s;
  }

  input[type="number"]:focus {
    border-color: #0077cc;
    outline: none;
  }

  button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    font-size: 16px;
    background-color: #0077cc;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
  }

  button:hover {
    background-color: #005fa3;
  }

  #result {
    margin-top: 25px;
    background: #e0f2ff;
    padding: 15px;
    border-radius: 8px;
    font-weight: bold;
    color: #0369a1;
    line-height: 1.6;
  }

  @media(max-width: 450px) {
    .calculator {
      padding: 20px;
    }
    button, input {
      font-size: 14px;
      padding: 10px;
    }
  }
</style>
</head>
<body>

<div class="calculator">
  <h2>Grade Calculator</h2>

  <label>Subject 1:</label>
  <input type="number" id="sub1" min="0" max="100" placeholder="0-100">

  <label>Subject 2:</label>
  <input type="number" id="sub2" min="0" max="100" placeholder="0-100">

  <label>Subject 3:</label>
  <input type="number" id="sub3" min="0" max="100" placeholder="0-100">

  <label>Subject 4:</label>
  <input type="number" id="sub4" min="0" max="100" placeholder="0-100">

  <label>Subject 5:</label>
  <input type="number" id="sub5" min="0" max="100" placeholder="0-100">

  <button onclick="calculateGrade()">Calculate Grade</button>

  <div id="result"></div>
</div>

<script>
function calculateGrade() {
  const s1 = parseFloat(document.getElementById("sub1").value) || 0;
  const s2 = parseFloat(document.getElementById("sub2").value) || 0;
  const s3 = parseFloat(document.getElementById("sub3").value) || 0;
  const s4 = parseFloat(document.getElementById("sub4").value) || 0;
  const s5 = parseFloat(document.getElementById("sub5").value) || 0;

  if ([s1, s2, s3, s4, s5].some(x => x < 0 || x > 100)) {
    document.getElementById("result").innerHTML = '⚠️ Please enter marks between 0 and 100.';
    return;
  }

  const total = s1 + s2 + s3 + s4 + s5;
  const average = total / 5;
  let grade;

  if (average >= 90) grade = "A+";
  else if (average >= 80) grade = "A";
  else if (average >= 70) grade = "B";
  else if (average >= 60) grade = "C";
  else if (average >= 50) grade = "D";
  else grade = "F";

  document.getElementById("result").innerHTML = `
    Total Marks: <span>${total.toFixed(2)}</span><br>
    Average: <span>${average.toFixed(2)}</span><br>
    Grade: <strong>${grade}</strong>
  `;
}
</script>

</body>
</html>
